---
# Kubernetes CronJob for Scheduled Atomic Red Team Validation
# Deploy as: kubectl apply -f atomic_test_scheduler.yaml

apiVersion: batch/v1
kind: CronJob
metadata:
  name: atomic-red-team-validation
  namespace: security-testing
  labels:
    app: atomic-red-team
    component: purple-team-validation
spec:
  # Schedule: Weekly Monday 2 AM AEST (Sunday 16:00 UTC)
  schedule: "0 16 * * 0"

  # Keep last 3 successful and 1 failed job
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  # Don't start new job if previous one is still running
  concurrencyPolicy: Forbid

  jobTemplate:
    metadata:
      labels:
        app: atomic-red-team
        job-type: validation
    spec:
      # Timeout after 2 hours
      activeDeadlineSeconds: 7200

      template:
        metadata:
          labels:
            app: atomic-red-team
        spec:
          restartPolicy: OnFailure

          # Use Windows node selector (if applicable)
          nodeSelector:
            kubernetes.io/os: windows

          containers:
          - name: atomic-executor
            image: your-registry/atomic-redteam:latest
            imagePullPolicy: Always

            command:
            - powershell.exe
            - -NoProfile
            - -NonInteractive
            - -Command

            args:
            - |
              # Import Invoke-AtomicRedTeam module
              Import-Module /atomic-red-team/invoke-atomicredteam/Invoke-AtomicRedTeam.psd1

              # Load test matrix
              $matrix = Get-Content /config/attack_test_matrix.json | ConvertFrom-Json

              # Initialize results
              $results = @{
                start_time = (Get-Date).ToString('o')
                tests = @()
              }

              # Execute each technique
              foreach ($test in $matrix.test_plan) {
                  Write-Host "Executing: $($test.technique_id) - $($test.technique_name)"

                  try {
                      Invoke-AtomicTest -AtomicTechnique $test.technique_id -Confirm:$False -TimeoutSeconds 120

                      $results.tests += @{
                          technique = $test.technique_id
                          status = 'success'
                          timestamp = (Get-Date).ToString('o')
                      }
                  }
                  catch {
                      Write-Warning "Failed: $($test.technique_id) - $($_.Exception.Message)"

                      $results.tests += @{
                          technique = $test.technique_id
                          status = 'failed'
                          error = $_.Exception.Message
                          timestamp = (Get-Date).ToString('o')
                      }
                  }

                  # Wait between tests for SIEM ingestion
                  Start-Sleep -Seconds 10
              }

              $results.end_time = (Get-Date).ToString('o')

              # Export results
              $results | ConvertTo-Json -Depth 10 | Out-File /results/test_results_$(Get-Date -Format 'yyyyMMdd_HHmmss').json

              Write-Host "Execution complete. Results saved."

            env:
            # SIEM connection details
            - name: SIEM_URL
              valueFrom:
                configMapKeyRef:
                  name: siem-config
                  key: url

            - name: SIEM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: siem-credentials
                  key: api_key

            # Test configuration
            - name: TECHNIQUE_FILTER
              value: ""  # Empty = all techniques

            - name: DRY_RUN
              value: "false"

            volumeMounts:
            - name: test-matrix
              mountPath: /config
              readOnly: true

            - name: results-volume
              mountPath: /results

            - name: atomic-tests
              mountPath: /atomic-red-team
              readOnly: true

            resources:
              requests:
                memory: "512Mi"
                cpu: "500m"
              limits:
                memory: "2Gi"
                cpu: "2000m"

          volumes:
          - name: test-matrix
            configMap:
              name: atomic-test-matrix

          - name: results-volume
            persistentVolumeClaim:
              claimName: atomic-results-pvc

          - name: atomic-tests
            persistentVolumeClaim:
              claimName: atomic-red-team-pvc

---
# ConfigMap for Test Matrix
apiVersion: v1
kind: ConfigMap
metadata:
  name: atomic-test-matrix
  namespace: security-testing
data:
  attack_test_matrix.json: |
    {
      "test_plan": [
        {
          "technique_id": "T1059.001",
          "technique_name": "PowerShell",
          "priority": "CRITICAL"
        },
        {
          "technique_id": "T1548",
          "technique_name": "Abuse Elevation Control",
          "priority": "CRITICAL"
        }
      ]
    }

---
# ConfigMap for SIEM Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: siem-config
  namespace: security-testing
data:
  url: "https://splunk.example.com:8089"
  index: "atomic_tests"

---
# Secret for SIEM Credentials
apiVersion: v1
kind: Secret
metadata:
  name: siem-credentials
  namespace: security-testing
type: Opaque
stringData:
  api_key: "YOUR_SIEM_API_KEY_HERE"
  username: "atomic_test_user"
  password: "CHANGE_ME"

---
# PersistentVolumeClaim for Results Storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atomic-results-pvc
  namespace: security-testing
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: security-testing
  labels:
    name: security-testing
    purpose: purple-team-validation
